<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-labelledby="title desc"><title id="title">OA 信息协作表关系</title><desc id="desc">公告、讨论、通讯录、笔记四个功能的表结构与关联关系</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/></marker><style>.t{font:700 30px sans-serif;fill:#0f172a}.st{font:15px sans-serif;fill:#475569}.gl{font:700 20px sans-serif}.n{font:700 18px monospace;fill:#0f172a}.n2{font:700 15px monospace;fill:#0f172a}.d{font:14px sans-serif;fill:#475569}.k{font:13px monospace;fill:#64748b}.b{stroke-width:1.5;rx:12}.grp{fill:none;stroke-dasharray:6 5;stroke-width:1.5;rx:14}.p{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#a)}.pd{fill:none;stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:5 4;marker-end:url(#b)}.an{fill:#eff6ff;stroke:#60a5fa}.di{fill:#fff7ed;stroke:#fb923c}.ct{fill:#f0fdf4;stroke:#4ade80}.nt{fill:#faf5ff;stroke:#c084fc}.sy{fill:#f1f5f9;stroke:#94a3b8}</style></defs><rect width="1600" height="1180" fill="#f8fafc"/><text x="60" y="58" class="t">OA 信息协作表关系</text><text x="60" y="92" class="st">公告、讨论、通讯录、笔记四个功能的数据彼此独立；阅读 / 共享 / 回复落在关系表，删除本人接收关系不影响其他人。均不涉及 BPM</text><rect x="60" y="120" width="700" height="280" class="grp" stroke="#93c5fd"/><text x="84" y="153" class="gl" fill="#2563eb">① 公告管理</text><rect x="90" y="175" width="280" height="190" class="b an"/><text x="112" y="212" class="n">oa_announcement</text><text x="112" y="246" class="d">type / priority</text><text x="112" y="272" class="d">title / content / url</text><text x="112" y="298" class="d">top</text><text x="112" y="332" class="k">creator = 发布人</text><rect x="450" y="175" width="290" height="190" class="b an"/><text x="472" y="212" class="n2">oa_announcement_receiver</text><text x="472" y="246" class="d">announcement_id</text><text x="472" y="272" class="d">receiver_user_id</text><text x="472" y="298" class="d">read_status</text><text x="472" y="332" class="k">唯一：同公告不重复发</text><path d="M370 270 H450" class="p"/><text x="382" y="258" class="k">1 : N</text><text x="360" y="294" class="k">announcement_id</text><rect x="820" y="120" width="720" height="520" class="grp" stroke="#fdba74"/><text x="844" y="153" class="gl" fill="#ea580c">② 讨论区</text><rect x="850" y="175" width="280" height="200" class="b di"/><text x="872" y="212" class="n">oa_discussion</text><text x="872" y="246" class="d">user_id / type</text><text x="872" y="272" class="d">title / content</text><text x="872" y="298" class="d">visit_count</text><text x="872" y="324" class="d">vote_multiple / 起止时间</text><text x="872" y="350" class="k">发布后 type 不可改</text><rect x="1230" y="175" width="290" height="130" class="b di"/><text x="1252" y="210" class="n2">oa_discussion_reply</text><text x="1252" y="242" class="d">discussion_id / user_id</text><text x="1252" y="268" class="d">parent_id / reply_user_id</text><text x="1252" y="290" class="k">楼中楼；删含子回复</text><rect x="1230" y="325" width="290" height="110" class="b di"/><text x="1252" y="360" class="n2">oa_discussion_like</text><text x="1252" y="392" class="d">discussion_id 或 reply_id</text><text x="1252" y="416" class="k">主题 / 回复二选一</text><rect x="850" y="420" width="280" height="100" class="b di"/><text x="872" y="455" class="n2">oa_vote_option</text><text x="872" y="487" class="d">discussion_id / title / sort</text><text x="872" y="508" class="k">仅创建时写入</text><rect x="1230" y="455" width="290" height="100" class="b di"/><text x="1252" y="490" class="n2">oa_vote_record</text><text x="1252" y="522" class="d">option_id / user_id</text><text x="1252" y="543" class="k">唯一：同选项不重复投</text><path d="M1130 230 H1230" class="p"/><text x="1145" y="218" class="k">1 : N</text><path d="M1130 300 C1180 320 1190 360 1230 370" class="p"/><text x="1145" y="350" class="k">1 : N</text><path d="M990 375 V420" class="p"/><text x="1000" y="405" class="k">vote</text><path d="M1130 470 H1230" class="p"/><text x="1145" y="458" class="k">1 : N</text><text x="850" y="555" class="k">单选只能投一次；多选可分次追加。点赞幂等。删除主题级联清理全部互动</text><text x="850" y="578" class="k">回复删除权在讨论发布人或超管，不在回复作者</text><rect x="60" y="440" width="700" height="300" class="grp" stroke="#86efac"/><text x="84" y="473" class="gl" fill="#16a34a">③ 通讯录</text><rect x="90" y="495" width="200" height="120" class="b ct"/><text x="105" y="530" class="n2">oa_contact_category</text><text x="105" y="562" class="d">user_id / name / sort</text><text x="105" y="590" class="k">个人分类</text><rect x="320" y="495" width="200" height="160" class="b ct"/><text x="335" y="530" class="n2">oa_contact</text><text x="335" y="562" class="d">category_id / name</text><text x="335" y="588" class="d">pinyin / sex</text><text x="335" y="614" class="d">mobile / company</text><text x="335" y="640" class="k">正文可被多人持有</text><rect x="545" y="495" width="195" height="160" class="b ct"/><text x="558" y="530" class="n2">oa_contact_share</text><text x="558" y="562" class="d">contact_id / user_id</text><text x="558" y="588" class="d">category_id</text><text x="558" y="614" class="d">handle_status</text><text x="558" y="640" class="k">最后持有人离开才删正文</text><path d="M290 555 H320" class="p"/><text x="292" y="543" class="k">1:N</text><path d="M520 555 H545" class="p"/><text x="522" y="543" class="k">1:N</text><text x="90" y="690" class="k">创建人写入 handle_status=1；共享接收人先 0，处理后归入本人分类</text><text x="90" y="714" class="k">接收人分类与主表 category_id 彼此独立；pinyin 由后端按姓名生成</text><rect x="820" y="680" width="720" height="260" class="grp" stroke="#d8b4fe"/><text x="844" y="713" class="gl" fill="#9333ea">④ 笔记管理</text><rect x="850" y="735" width="200" height="110" class="b nt"/><text x="865" y="770" class="n2">oa_note_category</text><text x="865" y="802" class="d">user_id / name / sort</text><text x="865" y="826" class="k">删目录会删本人笔记</text><rect x="1080" y="735" width="200" height="150" class="b nt"/><text x="1095" y="770" class="n2">oa_note</text><text x="1095" y="802" class="d">type / priority</text><text x="1095" y="828" class="d">favorite / content</text><text x="1095" y="854" class="k">creator = 所属人</text><rect x="1310" y="735" width="210" height="110" class="b nt"/><text x="1325" y="770" class="n2">oa_note_receiver</text><text x="1325" y="802" class="d">note_id / user_id</text><text x="1325" y="826" class="k">共享全量覆盖</text><path d="M1050 790 H1080" class="p"/><path d="M1280 790 H1310" class="p"/><text x="850" y="920" class="k">type：我的 / 公司 / 共享；favorite 仅本人可改；接收人只能看不能改正文</text><rect x="60" y="790" width="700" height="215" class="grp" stroke="#cbd5e1"/><text x="84" y="823" class="gl" fill="#475569">跨模块关联（System）</text><rect x="90" y="845" width="300" height="110" class="b sy"/><text x="112" y="882" class="n2">system_users</text><text x="112" y="914" class="d">各表 creator / user_id</text><text x="112" y="938" class="d">receiver / share.user_id</text><rect x="420" y="845" width="300" height="110" class="b sy"/><text x="442" y="882" class="n2">管理范围（下属）</text><text x="442" y="914" class="d">公告接收人 / 转发对象</text><text x="442" y="938" class="d">getUserListBySubordinate</text><text x="90" y="985" class="k">通讯录性别复用 SexEnum；优先级复用 OaPriorityEnum（oa_priority）</text><text x="60" y="1060" class="st">箭头表示业务字段关联，不代表数据库外键约束；虚线箭头表示跨模块或汇总关系。</text><text x="60" y="1090" class="st">公告接收范围、讨论删除权限、通讯录最后持有人、笔记共享覆盖策略，是本篇最容易踩坑的四个点。</text></svg>
