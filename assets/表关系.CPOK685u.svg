<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc"><title id="title">OA 出差与报销表关系</title><desc id="desc">出差申请、差旅报销、费用报销三个功能的表结构与关联关系</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/></marker><style>.t{font:700 30px sans-serif;fill:#0f172a}.st{font:15px sans-serif;fill:#475569}.gl{font:700 20px sans-serif}.n{font:700 18px monospace;fill:#0f172a}.n2{font:700 15px monospace;fill:#0f172a}.d{font:14px sans-serif;fill:#475569}.k{font:13px monospace;fill:#64748b}.b{stroke-width:1.5;rx:12}.grp{fill:none;stroke-dasharray:6 5;stroke-width:1.5;rx:14}.p{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#a)}.pd{fill:none;stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:5 4;marker-end:url(#b)}.ta{fill:#eff6ff;stroke:#60a5fa}.tr{fill:#fff7ed;stroke:#fb923c}.rb{fill:#faf5ff;stroke:#c084fc}.sy{fill:#f1f5f9;stroke:#94a3b8}</style></defs><rect width="1600" height="980" fill="#f8fafc"/><text x="60" y="58" class="t">OA 出差与报销表关系</text><text x="60" y="92" class="st">三类单据各自走 BPM；出差通过写考勤，差旅报销通过标申请已报销但不改支付状态；费用报销无业务单号且驳回后不可再改</text><rect x="60" y="130" width="480" height="380" class="grp" stroke="#93c5fd"/><text x="84" y="163" class="gl" fill="#2563eb">① 出差申请</text><rect x="90" y="185" width="420" height="300" class="b ta"/><text x="112" y="222" class="n2">oa_travel_apply</text><text x="112" y="256" class="d">no(CC) / dept_id / reason</text><text x="112" y="282" class="d">start_time / end_time / days</text><text x="112" y="308" class="d">items = 行程 JSON</text><text x="112" y="334" class="d">reimburse_status 报销状态</text><text x="112" y="360" class="d">status = BPM（oa_travel_apply）</text><text x="112" y="394" class="k">通过 → createApplyAttendance(TRAVEL)</text><text x="112" y="420" class="k">草稿/驳回/取消均可再编辑提交</text><text x="112" y="446" class="k">字典 oa_transport_type</text><rect x="580" y="130" width="480" height="380" class="grp" stroke="#fdba74"/><text x="604" y="163" class="gl" fill="#ea580c">② 差旅报销</text><rect x="610" y="185" width="420" height="300" class="b tr"/><text x="632" y="222" class="n2">oa_travel_reimbursement</text><text x="632" y="256" class="d">no(CLBX) / travel_apply_id</text><text x="632" y="282" class="d">total_price / items 费用 JSON</text><text x="632" y="308" class="d">pay_status 支付状态</text><text x="632" y="334" class="d">status = BPM（独立流程）</text><text x="632" y="360" class="d">关联申请须已审批通过</text><text x="632" y="394" class="k">通过 → 标申请已报销</text><text x="632" y="420" class="k">pay_status 审批不自动改</text><text x="632" y="446" class="k">字典 oa_expense_type / oa_pay_status</text><path d="M510 340 H610" class="p"/><text x="528" y="328" class="k">0..1</text><text x="520" y="364" class="k">travel_apply_id</text><rect x="1100" y="130" width="440" height="380" class="grp" stroke="#d8b4fe"/><text x="1124" y="163" class="gl" fill="#9333ea">③ 费用报销</text><rect x="1130" y="185" width="380" height="300" class="b rb"/><text x="1152" y="222" class="n2">oa_reimbursement</text><text x="1152" y="256" class="d">title / urgency / reason</text><text x="1152" y="282" class="d">witness_user_id</text><text x="1152" y="308" class="d">payment_method / total_price</text><text x="1152" y="334" class="d">items JSON / 无业务单号</text><text x="1152" y="360" class="d">status = BPM（oa_reimbursement）</text><text x="1152" y="394" class="k">仅草稿(-1)可编辑提交</text><text x="1152" y="420" class="k">驳回后不能再改（更严）</text><text x="1152" y="446" class="k">不产生付款记录</text><rect x="60" y="550" width="1480" height="340" class="grp" stroke="#cbd5e1"/><text x="84" y="583" class="gl" fill="#475569">跨模块关联（System / BPM / 考勤）</text><rect x="90" y="605" width="320" height="130" class="b sy"/><text x="112" y="642" class="n2">system_users</text><text x="112" y="676" class="d">creator = 申请人</text><text x="112" y="702" class="d">witness_user_id 证明人</text><rect x="450" y="605" width="320" height="130" class="b sy"/><text x="472" y="642" class="n2">system_dept</text><text x="472" y="676" class="d">dept_id 创建时冗余</text><text x="472" y="702" class="d">调岗不影响历史单据</text><rect x="810" y="605" width="320" height="130" class="b sy"/><text x="832" y="642" class="n2">BPM 流程实例</text><text x="832" y="676" class="d">三单各自 process_instance_id</text><text x="832" y="702" class="d">status = -1/1/2/3/4</text><rect x="1170" y="605" width="320" height="130" class="b sy"/><text x="1192" y="642" class="n2">oa_attendance</text><text x="1192" y="676" class="d">出差通过写入 type=TRAVEL</text><text x="1192" y="702" class="d">不增加上下班打卡次数</text><path d="M300 485 V605" class="pd"/><text x="312" y="550" class="k">通过写考勤</text><text x="90" y="770" class="k">status 复用 BpmProcessInstanceStatusEnum；字典 bpm_process_instance_status 通常不含 -1（草稿）</text><text x="90" y="796" class="k">字典：oa_transport_type / oa_expense_type / oa_reimburse_status / oa_pay_status / oa_apply_urgency / oa_reimbursement_payment_method</text><text x="90" y="822" class="k">箭头表示业务字段关联，不代表数据库外键约束；虚线表示跨模块副作用</text><text x="60" y="940" class="st">一张图覆盖出差申请、差旅报销、费用报销三节，与正文 ①②③ 章节顺序对应。</text></svg>
