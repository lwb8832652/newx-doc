<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc"><title id="title">OA 企业邮箱表关系</title><desc id="desc">邮箱服务配置、个人账号、文件夹与邮件索引的表结构与关联关系</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/></marker><style>.t{font:700 30px sans-serif;fill:#0f172a}.st{font:15px sans-serif;fill:#475569}.gl{font:700 20px sans-serif}.n{font:700 18px monospace;fill:#0f172a}.n2{font:700 15px monospace;fill:#0f172a}.d{font:14px sans-serif;fill:#475569}.k{font:13px monospace;fill:#64748b}.b{stroke-width:1.5;rx:12}.grp{fill:none;stroke-dasharray:6 5;stroke-width:1.5;rx:14}.p{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#a)}.pd{fill:none;stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:5 4;marker-end:url(#b)}.pv{fill:#eff6ff;stroke:#60a5fa}.ac{fill:#fff7ed;stroke:#fb923c}.ms{fill:#f0fdf4;stroke:#4ade80}.sy{fill:#f1f5f9;stroke:#94a3b8}</style></defs><rect width="1600" height="980" fill="#f8fafc"/><text x="60" y="58" class="t">OA 企业邮箱表关系</text><text x="60" y="92" class="st">管理员维护服务配置，用户绑定个人账号；文件夹与邮件索引按账号同步，正文按需缓存，附件仍从远端读取</text><rect x="60" y="130" width="360" height="300" class="grp" stroke="#93c5fd"/><text x="84" y="163" class="gl" fill="#2563eb">① 邮箱服务配置</text><rect x="90" y="185" width="300" height="220" class="b pv"/><text x="112" y="222" class="n">oa_mail_provider</text><text x="112" y="256" class="d">name</text><text x="112" y="282" class="d">imap / smtp（JSON）</text><text x="112" y="308" class="d">status = CommonStatusEnum</text><text x="112" y="342" class="k">SSL 与 STARTTLS 二选一</text><text x="112" y="366" class="k">无 OA_MAIL_* 字典</text><rect x="460" y="130" width="360" height="300" class="grp" stroke="#fdba74"/><text x="484" y="163" class="gl" fill="#ea580c">② 我的邮箱账号</text><rect x="490" y="185" width="300" height="220" class="b ac"/><text x="512" y="222" class="n">oa_mail_account</text><text x="512" y="256" class="d">provider_id / mail</text><text x="512" y="282" class="d">username / password</text><text x="512" y="308" class="d">default_status / status</text><text x="512" y="342" class="k">creator = 绑定用户</text><text x="512" y="366" class="k">身份绑定后不可改</text><path d="M390 295 H490" class="p"/><text x="410" y="282" class="k">1 : N</text><text x="400" y="318" class="k">provider_id</text><rect x="860" y="130" width="680" height="520" class="grp" stroke="#86efac"/><text x="884" y="163" class="gl" fill="#16a34a">③ 收件箱与邮件</text><rect x="890" y="185" width="300" height="220" class="b ms"/><text x="912" y="222" class="n">oa_mail_folder</text><text x="912" y="256" class="d">account_id / name</text><text x="912" y="282" class="d">type / uid_validity</text><text x="912" y="308" class="d">sync_time / available</text><text x="912" y="342" class="k">同步不创建远端目录</text><text x="912" y="366" class="k">uk: account + name</text><rect x="1220" y="185" width="300" height="280" class="b ms"/><text x="1242" y="222" class="n2">oa_mail_message</text><text x="1242" y="256" class="d">account_id / folder_id</text><text x="1242" y="282" class="d">uid_validity + uid</text><text x="1242" y="308" class="d">subject / content</text><text x="1242" y="334" class="d">recipients / ccs / …</text><text x="1242" y="360" class="d">read_status / attachments</text><text x="1242" y="394" class="k">content null = 未拉取</text><text x="1242" y="418" class="k">UNREAD = INBOX 未读</text><path d="M1190 295 H1220" class="p"/><text x="1148" y="282" class="k">1 : N</text><text x="1130" y="318" class="k">folder_id</text><path d="M790 250 C820 250 850 250 890 250" class="p"/><text x="800" y="238" class="k">1 : N</text><text x="800" y="272" class="k">account_id</text><path d="M790 340 C820 360 850 380 890 380" class="pd"/><text x="800" y="372" class="k">account_id</text><text x="890" y="500" class="k">删除：非 TRASH → MOVE 到 TRASH；已在 TRASH → UIDPLUS expunge</text><text x="890" y="524" class="k">同步(syncMailMessageList)加账号锁；草稿/发送依赖 UIDPLUS</text><text x="890" y="548" class="k">删除账号不解绑远端，也不级联清理 folder / message</text><text x="890" y="572" class="k">provider / account 的 status 共用 common_status（0 开启 / 1 关闭）</text><rect x="60" y="700" width="1480" height="200" class="grp" stroke="#cbd5e1"/><text x="84" y="733" class="gl" fill="#475569">跨模块关联（System）</text><rect x="90" y="755" width="360" height="120" class="b sy"/><text x="112" y="792" class="n2">system_users</text><text x="112" y="826" class="d">oa_mail_account.creator</text><text x="112" y="852" class="d">= 绑定邮箱的后台用户</text><text x="490" y="792" class="k">个人账号、文件夹、邮件索引均按账号归属校验，列表与详情只开放本人绑定的邮箱</text><text x="490" y="822" class="k">连接测试分别探测 IMAP / SMTP，不发送真实邮件</text><text x="490" y="852" class="k">本文企业邮箱不涉及 BPM 流程；远端邮件服务商侧的账号由管理员另行维护</text><text x="60" y="950" class="st">箭头表示业务字段关联，不代表数据库外键约束；虚线箭头表示同账号下的跨表冗余关联。</text></svg>
