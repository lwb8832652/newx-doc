<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc"><title id="title">OA 会议室与车辆表关系</title><desc id="desc">会议室信息、会议室预定、车辆信息、用车申请、还车申请五个功能的表结构与关联关系</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/></marker><style>.t{font:700 30px sans-serif;fill:#0f172a}.st{font:15px sans-serif;fill:#475569}.gl{font:700 20px sans-serif}.n{font:700 18px monospace;fill:#0f172a}.n2{font:700 15px monospace;fill:#0f172a}.d{font:14px sans-serif;fill:#475569}.k{font:13px monospace;fill:#64748b}.b{stroke-width:1.5;rx:12}.grp{fill:none;stroke-dasharray:6 5;stroke-width:1.5;rx:14}.p{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#a)}.pd{fill:none;stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:5 4;marker-end:url(#b)}.mr{fill:#eff6ff;stroke:#60a5fa}.bk{fill:#fff7ed;stroke:#fb923c}.vh{fill:#f0fdf4;stroke:#4ade80}.va{fill:#faf5ff;stroke:#c084fc}.vr{fill:#fef2f2;stroke:#f87171}.sy{fill:#f1f5f9;stroke:#94a3b8}</style></defs><rect width="1600" height="1120" fill="#f8fafc"/><text x="60" y="58" class="t">OA 会议室与车辆表关系</text><text x="60" y="92" class="st">会议室预定可短路审批；车辆台账状态手工维护；用车/还车双单 BPM，还车状态用 CAS 保证同时仅一份「还车中」</text><rect x="60" y="120" width="740" height="380" class="grp" stroke="#93c5fd"/><text x="84" y="153" class="gl" fill="#2563eb">① 会议室信息</text><rect x="90" y="175" width="320" height="290" class="b mr"/><text x="112" y="212" class="n">oa_meeting_room</text><text x="112" y="246" class="d">type / status / manager_user_id</text><text x="112" y="272" class="d">allow_booking / need_approval</text><text x="112" y="298" class="d">booking_scope / booking_user_ids</text><text x="112" y="324" class="d">equipments / file_urls JSON</text><text x="112" y="358" class="k">status: 0正常/1维修/2不可用</text><text x="112" y="384" class="k">scope: 0全部 / 1指定成员</text><text x="112" y="410" class="k">need_approval=false 时可短路</text><text x="112" y="436" class="k">字典 oa_meeting_room_*</text><rect x="860" y="120" width="680" height="380" class="grp" stroke="#fdba74"/><text x="884" y="153" class="gl" fill="#ea580c">② 会议室预定</text><rect x="890" y="175" width="620" height="290" class="b bk"/><text x="912" y="212" class="n2">oa_meeting_room_booking</text><text x="912" y="246" class="d">no(HY) / room_id / title</text><text x="912" y="272" class="d">start_time / end_time（左闭右开）</text><text x="912" y="298" class="d">moderator_user_id / attendee_user_ids</text><text x="912" y="324" class="d">status = BPM；use_status 本地使用</text><text x="912" y="350" class="d">need_approval 提交时快照</text><text x="912" y="384" class="k">流程 key: oa_meeting_room_booking</text><text x="912" y="410" class="k">use_status: 0待用/1使用中/2完成/3取消</text><text x="912" y="436" class="k">免审批 → status=2 且不启 BPM</text><path d="M410 320 H890" class="p"/><text x="620" y="308" class="k">1 : N</text><text x="600" y="336" class="k">room_id</text><rect x="60" y="530" width="480" height="280" class="grp" stroke="#86efac"/><text x="84" y="563" class="gl" fill="#16a34a">③ 车辆信息</text><rect x="90" y="585" width="420" height="200" class="b vh"/><text x="112" y="622" class="n">oa_vehicle</text><text x="112" y="656" class="d">no 车牌 UNIQUE / name / type</text><text x="112" y="682" class="d">category / seat_count / dept_id</text><text x="112" y="708" class="d">status: 0空闲/1停用/2使用中</text><text x="112" y="742" class="k">台账状态手工维护，审批不改写</text><text x="112" y="768" class="k">提交用车仅校验空闲(0)</text><rect x="570" y="530" width="500" height="280" class="grp" stroke="#d8b4fe"/><text x="594" y="563" class="gl" fill="#9333ea">④ 用车申请</text><rect x="600" y="585" width="440" height="200" class="b va"/><text x="622" y="622" class="n2">oa_vehicle_apply</text><text x="622" y="656" class="d">no(YC) / vehicle_id / vehicle_no</text><text x="622" y="682" class="d">status = BPM；return_status 还车</text><text x="622" y="708" class="d">0未生效/1待还/2还车中/3已还</text><text x="622" y="742" class="k">流程 key: oa_vehicle_apply</text><text x="622" y="768" class="k">通过 → return_status=待还车(1)</text><path d="M510 685 H600" class="p"/><text x="528" y="673" class="k">1 : N</text><text x="520" y="701" class="k">vehicle_id</text><rect x="1100" y="530" width="440" height="280" class="grp" stroke="#fca5a5"/><text x="1124" y="563" class="gl" fill="#dc2626">⑤ 还车申请</text><rect x="1130" y="585" width="380" height="200" class="b vr"/><text x="1152" y="622" class="n2">oa_vehicle_return</text><text x="1152" y="656" class="d">no(HC) / apply_id / vehicle_id</text><text x="1152" y="682" class="d">actual_return_time / location</text><text x="1152" y="708" class="d">status = 独立 BPM</text><text x="1152" y="742" class="k">流程 key: oa_vehicle_return</text><text x="1152" y="768" class="k">通过→已还；拒绝→待还车</text><path d="M1040 685 H1130" class="p"/><text x="1058" y="673" class="k">1 : N</text><text x="1050" y="701" class="k">apply_id</text><rect x="60" y="840" width="1480" height="210" class="grp" stroke="#cbd5e1"/><text x="84" y="873" class="gl" fill="#475569">跨模块关联（System / BPM）</text><rect x="90" y="895" width="320" height="110" class="b sy"/><text x="112" y="932" class="n2">system_users</text><text x="112" y="966" class="d">manager / moderator / user_id</text><text x="112" y="992" class="d">creator = 申请人</text><rect x="440" y="895" width="320" height="110" class="b sy"/><text x="462" y="932" class="n2">system_dept</text><text x="462" y="966" class="d">会议室/车辆/申请 dept_id</text><text x="462" y="992" class="d">创建时冗余部门</text><rect x="790" y="895" width="360" height="110" class="b sy"/><text x="812" y="932" class="n2">BPM 流程实例</text><text x="812" y="966" class="d">预定 / 用车 / 还车 各自独立</text><text x="812" y="992" class="d">status = -1/1/2/3/4</text><text x="1180" y="932" class="k">单号：HY 预定 / YC 用车 / HC 还车</text><text x="1180" y="962" class="k">还车 CAS：updateReturnStatus…</text><text x="1180" y="992" class="k">会议提醒 Job → reminded=1</text><text x="60" y="1085" class="st">箭头表示业务字段关联，不代表数据库外键约束。一张图覆盖会议室与车辆五节，与正文 ①~⑤ 章节顺序对应。</text></svg>
