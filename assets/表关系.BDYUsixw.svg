<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">HRM 工作台与组织架构核心表关系</title>
  <desc id="desc">展示后台账号、系统部门、员工主档、个人备忘，以及工作台聚合的数据来源。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b" />
    </marker>
    <style>
      .title { font: 700 26px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif; fill:#0f172a; }
      .subtitle { font: 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif; fill:#475569; }
      .box { rx:12; ry:12; stroke-width:1.5; }
      .core { fill:#dbeafe; stroke:#2563eb; }
      .system { fill:#fef3c7; stroke:#d97706; }
      .detail { fill:#f8fafc; stroke:#64748b; }
      .source { fill:#ecfdf5; stroke:#059669; }
      .box-title { font:700 17px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif; fill:#0f172a; }
      .box-sub { font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif; fill:#334155; }
      .field { font:14px ui-monospace,SFMono-Regular,Menlo,monospace; fill:#334155; }
      .edge { fill:none; stroke:#64748b; stroke-width:1.7; }
      .logical { stroke-dasharray:7 5; }
      .label-bg { fill:#fff; opacity:.94; }
      .edge-label { font:13px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif; fill:#334155; }
      .note { font:13px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif; fill:#475569; }
    </style>
  </defs>

  <rect width="1400" height="760" fill="#ffffff" />
  <text x="700" y="42" text-anchor="middle" class="title">HRM 工作台与组织架构核心表关系</text>
  <text x="700" y="68" text-anchor="middle" class="subtitle">虚线均为业务层逻辑关联；当前 DDL 不声明物理外键</text>

  <rect x="70" y="120" width="270" height="190" class="box system" />
  <text x="205" y="151" text-anchor="middle" class="box-title">system_users</text>
  <text x="205" y="177" text-anchor="middle" class="box-sub">后台账号</text>
  <text x="95" y="211" class="field">id</text>
  <text x="95" y="237" class="field">nickname</text>
  <text x="95" y="263" class="field">avatar</text>

  <rect x="565" y="105" width="300" height="245" class="box system" />
  <text x="715" y="136" text-anchor="middle" class="box-title">system_dept</text>
  <text x="715" y="162" text-anchor="middle" class="box-sub">组织部门（System 复用）</text>
  <text x="590" y="196" class="field">id</text>
  <text x="590" y="222" class="field">parent_id</text>
  <text x="590" y="248" class="field">name / sort / status</text>
  <text x="590" y="274" class="field">leader_user_id</text>
  <text x="590" y="300" class="field">phone / email</text>

  <rect x="1030" y="105" width="300" height="300" class="box core" />
  <text x="1180" y="136" text-anchor="middle" class="box-title">hrm_employee</text>
  <text x="1180" y="162" text-anchor="middle" class="box-sub">员工主档</text>
  <text x="1055" y="196" class="field">id</text>
  <text x="1055" y="222" class="field">user_id</text>
  <text x="1055" y="248" class="field">dept_id</text>
  <text x="1055" y="274" class="field">leader_employee_id</text>
  <text x="1055" y="300" class="field">entry_status / status / type</text>
  <text x="1055" y="326" class="field">entry_time / regular_time</text>
  <text x="1055" y="352" class="field">leave_time / birthday</text>
  <text x="1055" y="378" class="field">company_age_start_time</text>

  <rect x="1030" y="510" width="300" height="170" class="box detail" />
  <text x="1180" y="541" text-anchor="middle" class="box-title">hrm_employee_personal_note</text>
  <text x="1180" y="567" text-anchor="middle" class="box-sub">本人日历备忘</text>
  <text x="1055" y="601" class="field">id / employee_id</text>
  <text x="1055" y="627" class="field">content</text>
  <text x="1055" y="653" class="field">reminder_time</text>

  <rect x="70" y="430" width="720" height="250" class="box source" />
  <text x="430" y="464" text-anchor="middle" class="box-title">工作台聚合来源（不另建工作台表）</text>
  <text x="100" y="507" class="box-sub">HR 工作台</text>
  <text x="240" y="507" class="field">hrm_employee / change_record / contract / quit_info</text>
  <text x="240" y="535" class="field">hrm_recruit_post / candidate / interview</text>
  <text x="240" y="563" class="field">hrm_salary_month_record / month_employee_record</text>
  <text x="100" y="607" class="box-sub">团队工作台</text>
  <text x="240" y="607" class="field">leader_employee_id = 当前员工 id 的直属下属</text>
  <text x="100" y="645" class="box-sub">个人工作台</text>
  <text x="240" y="645" class="field">本人档案 / attendance_clock / salary_slip / personal_note</text>

  <path d="M340 205 C430 205 465 205 565 205" class="edge logical" />
  <rect x="411" y="181" width="132" height="22" class="label-bg" />
  <text x="477" y="197" text-anchor="middle" class="edge-label">leader_user_id → id</text>

  <path d="M340 265 C650 390 880 365 1030 225" class="edge logical" />
  <rect x="657" y="340" width="104" height="22" class="label-bg" />
  <text x="709" y="356" text-anchor="middle" class="edge-label">user_id → id</text>

  <path d="M865 245 C930 245 965 245 1030 245" class="edge logical" />
  <rect x="906" y="220" width="91" height="22" class="label-bg" />
  <text x="952" y="236" text-anchor="middle" class="edge-label">dept_id → id</text>

  <path d="M650 105 C585 80 585 56 650 55 C805 55 835 76 780 105" class="edge logical" />
  <rect x="642" y="48" width="147" height="22" class="label-bg" />
  <text x="716" y="64" text-anchor="middle" class="edge-label">parent_id → 本表 id</text>

  <path d="M1330 285 C1370 285 1370 435 1180 435 C1010 435 1000 335 1030 305" class="edge logical" />
  <rect x="1170" y="425" width="187" height="22" class="label-bg" />
  <text x="1264" y="441" text-anchor="middle" class="edge-label">leader_employee_id → 本表 id</text>

  <path d="M1180 405 L1180 510" class="edge logical" />
  <rect x="1190" y="447" width="132" height="22" class="label-bg" />
  <text x="1256" y="463" text-anchor="middle" class="edge-label">employee_id → id</text>

  <text x="70" y="725" class="note">说明：部门树按 parent_id 递归；组织页面的人数由 hrm_employee.dept_id 统计，团队页面则按直属汇报线统计，两者不是同一种范围。</text>
</svg>
