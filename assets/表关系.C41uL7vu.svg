<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc"><title id="title">OA 考勤与人事申请表关系</title><desc id="desc">考勤、请假、加班、转正、离职五个功能的表结构与关联关系</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/></marker><style>.t{font:700 30px sans-serif;fill:#0f172a}.st{font:15px sans-serif;fill:#475569}.gl{font:700 20px sans-serif}.n{font:700 18px monospace;fill:#0f172a}.n2{font:700 15px monospace;fill:#0f172a}.d{font:14px sans-serif;fill:#475569}.k{font:13px monospace;fill:#64748b}.b{stroke-width:1.5;rx:12}.grp{fill:none;stroke-dasharray:6 5;stroke-width:1.5;rx:14}.p{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#a)}.pd{fill:none;stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:5 4;marker-end:url(#b)}.at{fill:#eff6ff;stroke:#60a5fa}.lv{fill:#fff7ed;stroke:#fb923c}.ot{fill:#f0fdf4;stroke:#4ade80}.rg{fill:#faf5ff;stroke:#c084fc}.rs{fill:#fef2f2;stroke:#f87171}.sy{fill:#f1f5f9;stroke:#94a3b8}</style></defs><rect width="1600" height="1100" fill="#f8fafc"/><text x="60" y="58" class="t">OA 考勤与人事申请表关系</text><text x="60" y="92" class="st">考勤不走 BPM；请假/出差审批通过写入考勤；加班/转正/离职只改审批状态。请假等四类申请驳回后不能再编辑</text><rect x="60" y="130" width="500" height="300" class="grp" stroke="#93c5fd"/><text x="84" y="163" class="gl" fill="#2563eb">① 考勤管理</text><rect x="90" y="185" width="440" height="220" class="b at"/><text x="112" y="222" class="n">oa_attendance</text><text x="112" y="256" class="d">user_id / type / status</text><text x="112" y="282" class="d">attendance_time / attendance_ip</text><text x="112" y="308" class="d">type: 上班/下班/请假/出差</text><text x="112" y="334" class="d">status: 正常/迟到/早退/请假/出差</text><text x="112" y="368" class="k">不走 BPM；打卡窗口默认 05:00后~17:00前</text><rect x="600" y="130" width="460" height="300" class="grp" stroke="#fdba74"/><text x="624" y="163" class="gl" fill="#ea580c">② 请假申请</text><rect x="630" y="185" width="400" height="220" class="b lv"/><text x="652" y="222" class="n2">oa_leave_apply</text><text x="652" y="256" class="d">type / days / urgency</text><text x="652" y="282" class="d">OaLeaveTypeEnum + maxDays</text><text x="652" y="308" class="d">status = BPM（oa_leave_apply）</text><text x="652" y="334" class="d">仅草稿可改；驳回不可再编辑</text><text x="652" y="368" class="k">通过 → createApplyAttendance(LEAVE)</text><path d="M630 300 C560 300 540 300 530 300" class="pd"/><text x="540" y="288" class="k">写考勤</text><rect x="1100" y="130" width="440" height="300" class="grp" stroke="#86efac"/><text x="1124" y="163" class="gl" fill="#16a34a">③ 加班申请</text><rect x="1130" y="185" width="380" height="220" class="b ot"/><text x="1152" y="222" class="n2">oa_overtime_apply</text><text x="1152" y="256" class="d">type / days(一位小数)</text><text x="1152" y="282" class="d">status = BPM（oa_overtime_apply）</text><text x="1152" y="308" class="d">仅草稿可改；驳回不可再编辑</text><text x="1152" y="334" class="d">通过不写考勤</text><text x="1152" y="368" class="k">字典 oa_overtime_type</text><rect x="60" y="470" width="500" height="260" class="grp" stroke="#d8b4fe"/><text x="84" y="503" class="gl" fill="#9333ea">④ 转正申请</text><rect x="90" y="525" width="440" height="180" class="b rg"/><text x="112" y="562" class="n2">oa_regular_apply</text><text x="112" y="596" class="d">start_time / end_time / days</text><text x="112" y="622" class="d">experience / growth / suggestion…</text><text x="112" y="648" class="d">status = BPM（oa_regular_apply）</text><text x="112" y="682" class="k">仅草稿可改；不改 HRM 员工状态</text><rect x="600" y="470" width="460" height="260" class="grp" stroke="#fca5a5"/><text x="624" y="503" class="gl" fill="#dc2626">⑤ 离职申请</text><rect x="630" y="525" width="400" height="180" class="b rs"/><text x="652" y="562" class="n2">oa_resign_apply</text><text x="652" y="596" class="d">handover_user_id</text><text x="652" y="622" class="d">has_pending_reimbursement</text><text x="652" y="648" class="d">status = BPM（oa_resign_apply）</text><text x="652" y="682" class="k">仅草稿可改；不禁用账号</text><rect x="1100" y="470" width="440" height="260" class="grp" stroke="#cbd5e1"/><text x="1124" y="503" class="gl" fill="#475569">关联说明</text><text x="1130" y="550" class="k">出差写考勤在 travel 包：</text><text x="1130" y="576" class="k">oa_travel_apply 通过 → TRAVEL</text><text x="1130" y="602" class="k">四类人事申请驳回后均不可再编辑</text><text x="1130" y="628" class="k">（比用品领用、出差申请更严）</text><text x="1130" y="654" class="k">加班通过不写考勤记录</text><text x="1130" y="680" class="k">不以 HRM 员工档案作主档</text><rect x="60" y="770" width="1480" height="250" class="grp" stroke="#cbd5e1"/><text x="84" y="803" class="gl" fill="#475569">跨模块关联（System / BPM）</text><rect x="90" y="825" width="360" height="120" class="b sy"/><text x="112" y="862" class="n2">system_users</text><text x="112" y="896" class="d">attendance.user_id</text><text x="112" y="922" class="d">resign.handover_user_id / creator</text><rect x="490" y="825" width="360" height="120" class="b sy"/><text x="512" y="862" class="n2">BPM 流程实例</text><text x="512" y="896" class="d">请假/加班/转正/离职</text><text x="512" y="922" class="d">status = -1/1/2/3/4</text><rect x="890" y="825" width="400" height="120" class="b sy"/><text x="912" y="862" class="n2">字典</text><text x="912" y="896" class="d">oa_leave_type / oa_overtime_type</text><text x="912" y="922" class="d">oa_apply_urgency</text><text x="90" y="980" class="k">人事申请 status 复用 BpmProcessInstanceStatusEnum；字典 bpm_process_instance_status 通常不含 -1（草稿）</text><text x="90" y="1006" class="k">箭头表示业务字段关联，不代表数据库外键约束；虚线表示审批通过写入考勤的副作用</text><text x="60" y="1070" class="st">一张图覆盖考勤与四类人事申请，与正文 ①~⑤ 章节顺序对应。</text></svg>
