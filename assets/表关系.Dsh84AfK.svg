<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc"><title id="title">OA 公文管理表关系</title><desc id="desc">套红模板、公文发文、公文收文三个功能的表结构与关联关系</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/></marker><style>.t{font:700 30px sans-serif;fill:#0f172a}.st{font:15px sans-serif;fill:#475569}.gl{font:700 20px sans-serif}.n{font:700 18px monospace;fill:#0f172a}.n2{font:700 15px monospace;fill:#0f172a}.d{font:14px sans-serif;fill:#475569}.k{font:13px monospace;fill:#64748b}.b{stroke-width:1.5;rx:12}.grp{fill:none;stroke-dasharray:6 5;stroke-width:1.5;rx:14}.p{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#a)}.pd{fill:none;stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:5 4;marker-end:url(#b)}.tp{fill:#eff6ff;stroke:#60a5fa}.sd{fill:#fff7ed;stroke:#fb923c}.rc{fill:#f0fdf4;stroke:#4ade80}.sy{fill:#f1f5f9;stroke:#94a3b8}</style></defs><rect width="1600" height="980" fill="#f8fafc"/><text x="60" y="58" class="t">OA 公文管理表关系</text><text x="60" y="92" class="st">套红模板维护红头版式；发文走 BPM，通过后按主送/抄送部门生成收文；主送收文签收后走办理审批，抄送仅知会</text><rect x="60" y="130" width="340" height="280" class="grp" stroke="#93c5fd"/><text x="84" y="163" class="gl" fill="#2563eb">① 套红模板</text><rect x="90" y="185" width="280" height="200" class="b tp"/><text x="112" y="222" class="n2">oa_official_doc_template</text><text x="112" y="256" class="d">name / authority_name</text><text x="112" y="282" class="d">no_prefix / font_size</text><text x="112" y="308" class="d">seal_pic_url / separator_type</text><text x="112" y="334" class="d">status = CommonStatus</text><text x="112" y="368" class="k">印章图不关联 oa_seal</text><rect x="440" y="130" width="520" height="400" class="grp" stroke="#fdba74"/><text x="464" y="163" class="gl" fill="#ea580c">② 公文发文</text><rect x="470" y="185" width="460" height="310" class="b sd"/><text x="492" y="222" class="n2">oa_official_doc_send</text><text x="492" y="256" class="d">no / template_id / title</text><text x="492" y="282" class="d">document_no = 冗余文号</text><text x="492" y="308" class="d">main_dept_ids / copy_dept_ids</text><text x="492" y="334" class="d">secrecy / urgency / disclosure</text><text x="492" y="360" class="d">formal_file_url / file_urls</text><text x="492" y="386" class="d">status = BPM（oa_official_doc_send）</text><text x="492" y="420" class="k">通过后按主送/抄送生成收文</text><text x="492" y="446" class="k">仅草稿(-1)可改删；审批中可撤销</text><path d="M370 285 H470" class="p"/><text x="392" y="274" class="k">N : 1</text><text x="380" y="310" class="k">template_id</text><rect x="1000" y="130" width="540" height="400" class="grp" stroke="#86efac"/><text x="1024" y="163" class="gl" fill="#16a34a">③ 公文收文</text><rect x="1030" y="185" width="480" height="310" class="b rc"/><text x="1052" y="222" class="n2">oa_official_doc_receive</text><text x="1052" y="256" class="d">no / send_id / receive_type</text><text x="1052" y="282" class="d">receive_dept_id / handler_user_id</text><text x="1052" y="308" class="d">handle_status 办理状态</text><text x="1052" y="334" class="d">status = BPM（仅主送）</text><text x="1052" y="360" class="d">0主送可审批 / 1抄送不审批</text><text x="1052" y="386" class="d">claim 签收 → creator 归属</text><text x="1052" y="420" class="k">待签收→已签收→办理中→已办结</text><text x="1052" y="446" class="k">流程 Key：oa_official_doc_receive</text><path d="M930 340 H1030" class="p"/><text x="948" y="328" class="k">1 : N</text><text x="940" y="364" class="k">send_id</text><rect x="60" y="570" width="1480" height="320" class="grp" stroke="#cbd5e1"/><text x="84" y="603" class="gl" fill="#475569">跨模块关联（System / BPM）</text><rect x="90" y="625" width="340" height="140" class="b sy"/><text x="112" y="662" class="n2">system_users</text><text x="112" y="696" class="d">发文 signer_user_id</text><text x="112" y="722" class="d">收文 handler_user_id / creator</text><rect x="470" y="625" width="340" height="140" class="b sy"/><text x="492" y="662" class="n2">system_dept</text><text x="492" y="696" class="d">send_dept_id / receive_dept_id</text><text x="492" y="722" class="d">main_dept_ids / copy_dept_ids</text><rect x="850" y="625" width="400" height="140" class="b sy"/><text x="872" y="662" class="n2">BPM 流程实例</text><text x="872" y="696" class="d">process_instance_id</text><text x="872" y="722" class="d">status = -1/1/2/3/4</text><text x="90" y="800" class="k">发文、主送收文的 status 复用 BpmProcessInstanceStatusEnum；字典 bpm_process_instance_status 通常不含 -1（草稿）</text><text x="90" y="826" class="k">seal_pic_url 仅为图片 URL，不关联印章台账；收文列表按当前用户所属部门过滤</text><text x="90" y="852" class="k">箭头表示业务字段关联，不代表数据库外键约束；虚线箭头表示跨模块关系</text><text x="60" y="940" class="st">一张图覆盖套红模板、发文、收文三节，与正文 ①②③ 章节顺序对应。</text></svg>
