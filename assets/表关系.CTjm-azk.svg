<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1070" viewBox="0 0 1600 1070" role="img" aria-labelledby="title desc"><title id="title">OA 工作协作表关系</title><desc id="desc">日程、任务、工作计划、工作汇报四个功能的表结构与关联关系</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/></marker><style>.t{font:700 30px sans-serif;fill:#0f172a}.st{font:15px sans-serif;fill:#475569}.gl{font:700 20px sans-serif}.n{font:700 18px monospace;fill:#0f172a}.n2{font:700 15px monospace;fill:#0f172a}.d{font:14px sans-serif;fill:#475569}.k{font:13px monospace;fill:#64748b}.b{stroke-width:1.5;rx:12}.grp{fill:none;stroke-dasharray:6 5;stroke-width:1.5;rx:14}.p{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#a)}.pd{fill:none;stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:5 4;marker-end:url(#b)}.sc{fill:#eff6ff;stroke:#60a5fa}.tk{fill:#fff7ed;stroke:#fb923c}.pl{fill:#f0fdf4;stroke:#4ade80}.wr{fill:#faf5ff;stroke:#c084fc}.sy{fill:#f1f5f9;stroke:#94a3b8}</style></defs><rect width="1600" height="1070" fill="#f8fafc"/><text x="60" y="58" class="t">OA 工作协作表关系</text><text x="60" y="92" class="st">日程、任务、工作计划、工作汇报四个功能的数据彼此独立保存，均以通用字段 creator 归属到后台用户，仅在首页汇总展示</text><rect x="60" y="130" width="700" height="300" class="grp" stroke="#93c5fd"/><text x="84" y="163" class="gl" fill="#2563eb">① 日程管理</text><rect x="90" y="185" width="260" height="210" class="b sc"/><text x="112" y="222" class="n">oa_schedule</text><text x="112" y="256" class="d">type / priority</text><text x="112" y="282" class="d">title / description</text><text x="112" y="308" class="d">start_time / end_time</text><text x="112" y="334" class="d">remind / reminded</text><text x="112" y="368" class="k">creator = 创建人</text><rect x="470" y="185" width="270" height="210" class="b sc"/><text x="492" y="222" class="n2">oa_schedule_participant</text><text x="492" y="256" class="d">schedule_id / user_id</text><text x="492" y="282" class="d">read_status / read_time</text><text x="492" y="316" class="k">阅读回执，首次阅读才写入</text><text x="492" y="356" class="k">编辑日程按参与人差量增删，</text><text x="492" y="378" class="k">已读状态不会被重置</text><path d="M350 290 H470" class="p"/><text x="382" y="278" class="k">1 : N</text><text x="356" y="314" class="k">schedule_id</text><rect x="820" y="130" width="720" height="560" class="grp" stroke="#fdba74"/><text x="844" y="163" class="gl" fill="#ea580c">② 任务管理</text><rect x="850" y="245" width="280" height="230" class="b tk"/><text x="872" y="282" class="n">oa_task</text><text x="872" y="316" class="d">type / status</text><text x="872" y="342" class="d">title / description</text><text x="872" y="368" class="d">publish_time</text><text x="872" y="394" class="d">start_time / end_time</text><text x="872" y="420" class="d">top / canceled</text><text x="872" y="454" class="k">creator = 发布人</text><rect x="1230" y="185" width="290" height="160" class="b tk"/><text x="1252" y="222" class="n2">oa_task_receiver</text><text x="1252" y="256" class="d">task_id / user_id</text><text x="1252" y="282" class="d">status = 个人进度</text><text x="1252" y="316" class="k">唯一索引：同人不重复分派</text><rect x="1230" y="400" width="290" height="160" class="b tk"/><text x="1252" y="437" class="n2">oa_task_log</text><text x="1252" y="471" class="d">task_id / user_id</text><text x="1252" y="497" class="d">status / content</text><text x="1252" y="531" class="k">只追加，保留反馈流水</text><path d="M1130 320 C1180 300 1190 272 1230 265" class="p"/><text x="1142" y="288" class="k">1 : N</text><path d="M1130 400 C1180 420 1190 452 1230 468" class="p"/><text x="1142" y="452" class="k">1 : N</text><path d="M1230 300 C1190 340 1180 352 1132 350" class="pd"/><text x="850" y="600" class="k">任务整体 status = 所有接收人 status 的最小值（木桶效应）</text><text x="850" y="624" class="k">接收人只能反馈到「已提交(4)」，「已完成(5)」由发布人确认</text><text x="850" y="648" class="k">canceled 是独立标记，不占用 status 取值</text><rect x="60" y="470" width="340" height="260" class="grp" stroke="#86efac"/><text x="84" y="503" class="gl" fill="#16a34a">③ 工作计划</text><rect x="90" y="525" width="280" height="180" class="b pl"/><text x="112" y="562" class="n">oa_plan</text><text x="112" y="596" class="d">type / status</text><text x="112" y="622" class="d">content / summary</text><text x="112" y="648" class="d">comment = 上级点评</text><text x="112" y="682" class="k">单表，无子表</text><rect x="430" y="470" width="340" height="260" class="grp" stroke="#d8b4fe"/><text x="454" y="503" class="gl" fill="#9333ea">④ 工作汇报</text><rect x="460" y="525" width="280" height="180" class="b wr"/><text x="482" y="562" class="n2">oa_work_report</text><text x="482" y="596" class="d">no / type / status</text><text x="482" y="622" class="d">start_time / end_time</text><text x="482" y="648" class="d">work_items / plan_items</text><text x="482" y="682" class="k">单表，明细以 JSON 保存</text><rect x="60" y="760" width="1480" height="215" class="grp" stroke="#cbd5e1"/><text x="84" y="793" class="gl" fill="#475569">跨模块关联（System）</text><rect x="90" y="815" width="360" height="120" class="b sy"/><text x="112" y="852" class="n2">system_users</text><text x="112" y="886" class="d">各表 creator = 数据归属人</text><text x="112" y="912" class="d">participant / receiver.user_id</text><rect x="490" y="815" width="360" height="120" class="b sy"/><text x="512" y="852" class="n2">system_dept</text><text x="512" y="886" class="d">oa_work_report.dept_id</text><text x="512" y="912" class="d">创建时冗余，调岗不影响历史</text><path d="M620 708 V806" class="pd"/><text x="632" y="744" class="k">dept_id</text><text x="900" y="852" class="k">工作计划点评、工作汇报统计，均通过 System 的「管理范围（下属）」判断数据权限</text><text x="900" y="882" class="k">工作汇报统计还需要 oa:work-report:statistics 权限，且只开放「已提交」的汇报</text><text x="900" y="912" class="k">本文四个功能均不涉及 BPM 流程，工作汇报的「提交」只是改变状态</text><text x="60" y="1030" class="st">箭头表示业务字段关联，不代表数据库外键约束；虚线箭头表示跨模块或汇总关系。</text></svg>
