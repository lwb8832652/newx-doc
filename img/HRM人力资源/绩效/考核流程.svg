<svg xmlns="http://www.w3.org/2000/svg" width="1740" height="1180" viewBox="0 0 1740 1180" role="img" aria-labelledby="title desc">
  <title id="title">HRM 绩效考核流程</title>
  <desc id="desc">展示管理员启动计划、员工填写指标、评分、结果审核、面谈、结果确认、申诉重评和归档的完整流程</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <style>
      .title{font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}
      .lane{font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#334155}
      .txt{font:600 15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a;text-anchor:middle}
      .small{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#475569;text-anchor:middle}
      .label{font:13px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#334155}
      .admin{fill:#eff6ff;stroke:#60a5fa;stroke-width:1.6}
      .portal{fill:#f0fdf4;stroke:#4ade80;stroke-width:1.6}
      .system{fill:#fff7ed;stroke:#fb923c;stroke-width:1.6}
      .end{fill:#faf5ff;stroke:#c084fc;stroke-width:1.6}
      .decision{fill:#fff;stroke:#94a3b8;stroke-width:1.6}
      .line{fill:none;stroke:#64748b;stroke-width:1.8;marker-end:url(#arrow)}
      .primary{fill:none;stroke:#2563eb;stroke-width:2.2;marker-end:url(#arrowBlue)}
      .retry{fill:none;stroke:#dc2626;stroke-width:1.8;stroke-dasharray:7 5;marker-end:url(#arrow)}
      .laneBg{fill:#fff;stroke:#e2e8f0;stroke-width:1}
    </style>
  </defs>
  <rect width="1740" height="1180" fill="#f8fafc"/>
  <text x="60" y="56" class="title">HRM 绩效考核端到端流程</text>
  <text x="60" y="88" class="label">蓝色：管理端计划动作　绿色：员工端任务　橙色：系统自动流转　红色虚线：驳回或申诉通过后的重开</text>

  <rect x="50" y="120" width="1640" height="290" rx="14" class="laneBg"/>
  <text x="80" y="154" class="lane">管理端</text>
  <rect x="110" y="190" width="210" height="72" rx="10" class="admin"/>
  <text x="215" y="221" class="txt">创建绩效计划</text>
  <text x="215" y="244" class="small">未开始（2）</text>
  <rect x="390" y="190" width="210" height="72" rx="10" class="admin"/>
  <text x="495" y="221" class="txt">维护参评员工</text>
  <text x="495" y="244" class="small">未开始阶段可加人/移人</text>
  <rect x="670" y="190" width="210" height="72" rx="10" class="admin"/>
  <text x="775" y="221" class="txt">启动计划</text>
  <text x="775" y="244" class="small">初始化指标和全部阶段</text>
  <rect x="950" y="190" width="210" height="72" rx="10" class="admin"/>
  <text x="1055" y="221" class="txt">开启评分</text>
  <text x="1055" y="244" class="small">须全员进入执行中</text>
  <rect x="1230" y="190" width="210" height="72" rx="10" class="admin"/>
  <text x="1335" y="221" class="txt">发起绩效面谈</text>
  <text x="1335" y="244" class="small">计划级动作</text>
  <rect x="1470" y="310" width="170" height="72" rx="10" class="admin"/>
  <text x="1555" y="341" class="txt">归档计划</text>
  <text x="1555" y="364" class="small">全员结束后执行</text>

  <path d="M320 226 H390" class="primary"/>
  <path d="M600 226 H670" class="primary"/>
  <path d="M775 262 V410 H215 V510" class="primary"/>
  <path d="M1200 500 V410 H1055 V262" class="primary"/>
  <path d="M950 226 H920 V420 H80 V723 H110" class="primary"/>

  <rect x="50" y="438" width="1640" height="490" rx="14" class="laneBg"/>
  <text x="80" y="472" class="lane">员工端任务中心</text>

  <polygon points="215,510 300,560 215,610 130,560" class="decision"/>
  <text x="215" y="554" class="txt">指标由谁制定？</text>
  <text x="215" y="576" class="small">系统 / 员工填写</text>

  <rect x="370" y="500" width="210" height="72" rx="10" class="portal"/>
  <text x="475" y="531" class="txt">指标填写</text>
  <text x="475" y="554" class="small">仅 allowEdit 维度</text>
  <polygon points="680,500 765,550 680,600 595,550" class="decision"/>
  <text x="680" y="544" class="txt">需要目标确认？</text>
  <text x="680" y="566" class="small">是 / 否</text>
  <rect x="825" y="500" width="210" height="72" rx="10" class="portal"/>
  <text x="930" y="531" class="txt">目标确认</text>
  <text x="930" y="554" class="small">通过或驳回</text>
  <rect x="1095" y="500" width="210" height="72" rx="10" class="system"/>
  <text x="1200" y="531" class="txt">执行中</text>
  <text x="1200" y="554" class="small">等待管理员开启评分</text>

  <rect x="110" y="680" width="240" height="86" rx="10" class="portal"/>
  <text x="230" y="713" class="txt">多级评分</text>
  <text x="230" y="736" class="small">自评 / 上级 / 部门负责人 / 指定人</text>
  <text x="230" y="756" class="small">按阶段权重汇总</text>
  <rect x="430" y="680" width="220" height="86" rx="10" class="portal"/>
  <text x="540" y="713" class="txt">结果审核</text>
  <text x="540" y="736" class="small">可配置最多 3 级</text>
  <text x="540" y="756" class="small">驳回须选择重评阶段</text>
  <polygon points="770,668 865,723 770,778 675,723" class="decision"/>
  <text x="770" y="717" class="txt">开启结果确认？</text>
  <text x="770" y="739" class="small">是 / 否</text>
  <rect x="920" y="680" width="220" height="86" rx="10" class="portal"/>
  <text x="1030" y="713" class="txt">员工结果确认</text>
  <text x="1030" y="736" class="small">确认通过，或提交申诉</text>
  <rect x="1210" y="680" width="220" height="86" rx="10" class="portal"/>
  <text x="1320" y="713" class="txt">多级申诉处理</text>
  <text x="1320" y="736" class="small">可配置最多 3 级</text>
  <text x="1320" y="756" class="small">支持超时自动通过/拒绝</text>
  <polygon points="1540,668 1625,723 1540,778 1455,723" class="decision"/>
  <text x="1540" y="717" class="txt">申诉结果</text>
  <text x="1540" y="739" class="small">通过 / 驳回</text>

  <rect x="675" y="830" width="190" height="68" rx="34" class="end"/>
  <text x="770" y="859" class="txt">考核结束</text>
  <text x="770" y="881" class="small">等待计划归档</text>

  <path d="M215 610 V640 H1200 V572" class="line"/>
  <text x="228" y="631" class="label">系统制定</text>
  <path d="M300 560 H370" class="primary"/>
  <text x="315" y="548" class="label">员工填写</text>
  <path d="M580 536 H595" class="primary"/>
  <path d="M680 600 V630 H1200 V572" class="line"/>
  <text x="693" y="621" class="label">否</text>
  <path d="M765 550 H825" class="primary"/>
  <text x="785" y="538" class="label">是</text>
  <path d="M1035 536 H1095" class="primary"/>
  <path d="M930 572 V635 H475 V572" class="retry"/>
  <text x="708" y="625" class="label">驳回：重开指标填写</text>

  <path d="M350 723 H430" class="primary"/>
  <path d="M430 723 H70 V420 H1210 V226 H1230" class="primary"/>
  <text x="560" y="410" class="label">首次结果审核完成后，管理员发起面谈</text>
  <path d="M540 766 V805 H230 V766" class="retry"/>
  <text x="354" y="798" class="label">审核驳回：只重开选中的评分阶段</text>
  <path d="M650 690 V655 H900 V690 H920" class="retry"/>
  <text x="675" y="646" class="label">申诉重评且已面谈：审核后直接重开结果确认</text>
  <path d="M865 723 H920" class="primary"/>
  <text x="879" y="710" class="label">是</text>
  <path d="M770 778 V830" class="line"/>
  <text x="783" y="806" class="label">否</text>
  <path d="M1140 706 H1210" class="primary"/>
  <text x="1154" y="694" class="label">申诉</text>
  <path d="M1030 766 V830 H865" class="line"/>
  <text x="965" y="817" class="label">确认</text>
  <path d="M1430 723 H1455" class="primary"/>
  <path d="M1540 778 V810 H865 V864" class="line"/>
  <text x="1560" y="808" class="label">驳回：维持原结果</text>
  <path d="M1540 668 V650 H1670 V915 H230 V766" class="retry"/>
  <text x="1030" y="908" class="label">申诉通过：清空最终结果并重开员工选中的评分阶段</text>

  <path d="M1335 262 V420 H770 V668" class="primary"/>
  <text x="965" y="446" class="label">面谈后按是否开启结果确认分流</text>
  <path d="M865 864 H1555 V382" class="primary"/>

  <rect x="50" y="956" width="1640" height="166" rx="14" class="laneBg"/>
  <text x="80" y="990" class="lane">关键系统约束</text>
  <rect x="110" y="1018" width="450" height="72" rx="10" class="system"/>
  <text x="335" y="1047" class="txt">启动时解析每名员工的实际处理人</text>
  <text x="335" y="1070" class="small">必办节点处理员工未绑定后台账号，则启动失败</text>
  <rect x="645" y="1018" width="450" height="72" rx="10" class="system"/>
  <text x="870" y="1047" class="txt">评分仅在全部阶段齐备后生成最终等级</text>
  <text x="870" y="1070" class="small">维度权重 × 指标权重 × 评分阶段权重</text>
  <rect x="1180" y="1018" width="450" height="72" rx="10" class="system"/>
  <text x="1405" y="1047" class="txt">归档是状态流转，不复制到另一套档案表</text>
  <text x="1405" y="1070" class="small">归档后写 assessment.archive_time</text>
</svg>
