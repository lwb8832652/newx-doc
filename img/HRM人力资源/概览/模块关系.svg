<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="720" viewBox="0 0 1320 720" role="img" aria-labelledby="title desc">
  <title id="title">HRM 模块关系</title>
  <desc id="desc">System 账号和部门、HRM 员工主档、招聘、考勤、社保、薪资、绩效以及 BPM 请假流程之间的逻辑关系。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#f7f5ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1f2937" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .subtitle { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .box-title { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .box-table { font: 500 14px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #475569; }
      .box-note { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .line { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow); }
      .label { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect width="1320" height="720" rx="24" fill="url(#bg)"/>
  <text x="54" y="58" class="title">HRM 模块关系</text>
  <text x="54" y="86" class="subtitle">员工主档是业务中心；实线表示核心业务关联，虚线表示转换、计算或流程同步。</text>

  <!-- relationship lines -->
  <path class="line" d="M 260 182 C 350 182, 360 274, 455 274"/>
  <text x="317" y="202" class="label">user_id</text>
  <path class="line" d="M 260 284 C 345 284, 365 304, 455 304"/>
  <text x="320" y="274" class="label">dept_id</text>
  <path class="dash" d="M 455 374 C 370 385, 340 446, 260 446"/>
  <text x="318" y="410" class="label">办理入职</text>
  <path class="line" d="M 685 272 C 760 202, 800 176, 875 176"/>
  <path class="line" d="M 685 292 C 760 280, 800 274, 875 274"/>
  <path class="line" d="M 685 314 C 760 345, 805 376, 875 376"/>
  <path class="line" d="M 685 335 C 760 430, 805 478, 875 478"/>
  <path class="line" d="M 685 354 C 760 535, 810 580, 875 580"/>
  <text x="744" y="252" class="label">employee_id</text>
  <path class="dash" d="M 1105 176 C 1190 176, 1200 274, 1105 274"/>
  <text x="1141" y="212" class="label">出勤统计</text>
  <path class="dash" d="M 1105 274 C 1190 306, 1190 376, 1105 376"/>
  <text x="1142" y="326" class="label">月度参保</text>
  <path class="dash" d="M 1105 176 C 1235 176, 1235 625, 1010 625 C 930 625, 930 590, 875 590"/>
  <text x="1192" y="424" class="label">请假审批</text>

  <!-- system boxes -->
  <g filter="url(#shadow)">
    <rect x="54" y="128" width="206" height="108" rx="14" fill="#e8f3ff" stroke="#93c5fd"/>
    <rect x="54" y="246" width="206" height="108" rx="14" fill="#e8f3ff" stroke="#93c5fd"/>
    <rect x="54" y="392" width="206" height="108" rx="14" fill="#fff7e8" stroke="#f5bd62"/>
  </g>
  <text x="78" y="163" class="box-title">后台账号</text>
  <text x="78" y="190" class="box-table">system_users</text>
  <text x="78" y="214" class="box-note">登录、角色与菜单权限</text>
  <text x="78" y="281" class="box-title">组织部门</text>
  <text x="78" y="308" class="box-table">system_dept</text>
  <text x="78" y="332" class="box-note">复用 System 部门树</text>
  <text x="78" y="427" class="box-title">招聘</text>
  <text x="78" y="454" class="box-table">hrm_recruit_*</text>
  <text x="78" y="478" class="box-note">职位、候选人、面试</text>

  <!-- employee core -->
  <g filter="url(#shadow)">
    <rect x="455" y="210" width="230" height="188" rx="18" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
  </g>
  <circle cx="493" cy="250" r="18" fill="#6366f1"/>
  <path d="M 484 250 l7 7 l12 -15" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="525" y="256" class="box-title">员工主档</text>
  <text x="485" y="298" class="box-table">hrm_employee</text>
  <text x="485" y="328" class="box-note">账号、部门、直属上级</text>
  <text x="485" y="352" class="box-note">入职、转正、异动、离职</text>
  <text x="485" y="376" class="box-note">员工资料与经历</text>

  <!-- downstream domains -->
  <g filter="url(#shadow)">
    <rect x="875" y="128" width="230" height="96" rx="14" fill="#ecfdf5" stroke="#6ee7b7"/>
    <rect x="875" y="230" width="230" height="96" rx="14" fill="#f0fdfa" stroke="#5eead4"/>
    <rect x="875" y="332" width="230" height="96" rx="14" fill="#fff7ed" stroke="#fdba74"/>
    <rect x="875" y="434" width="230" height="96" rx="14" fill="#fef2f2" stroke="#fca5a5"/>
    <rect x="875" y="536" width="230" height="96" rx="14" fill="#faf5ff" stroke="#d8b4fe"/>
  </g>
  <text x="901" y="162" class="box-title">考勤</text>
  <text x="901" y="190" class="box-table">hrm_attendance_*</text>
  <text x="901" y="264" class="box-title">社保</text>
  <text x="901" y="292" class="box-table">hrm_insurance_*</text>
  <text x="901" y="366" class="box-title">薪资</text>
  <text x="901" y="394" class="box-table">hrm_salary_*</text>
  <text x="901" y="468" class="box-title">绩效</text>
  <text x="901" y="496" class="box-table">hrm_performance_*</text>
  <text x="901" y="570" class="box-title">请假记录与 BPM</text>
  <text x="901" y="598" class="box-table">HRM 表：hrm_attendance_leave</text>

  <rect x="54" y="650" width="1212" height="38" rx="10" fill="#ffffff" fill-opacity="0.82" stroke="#dbe4f0"/>
  <text x="75" y="675" class="box-note">公共约束：tenant_id 多租户隔离 · deleted 逻辑删除 · creator/create_time/updater/update_time 审计 · 业务关系由 Service 校验</text>
</svg>
