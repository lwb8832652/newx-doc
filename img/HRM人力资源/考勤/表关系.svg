<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">HRM 考勤管理表关系</title>
  <desc id="desc">考勤组、节假日、打卡、请假与员工、部门、BPM、实时统计的逻辑关系。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#7c3aed"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title{font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif;font-size:25px;font-weight:700;fill:#0f172a}
      .subtitle{font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif;font-size:13px;font-weight:400;fill:#64748b}
      .box-title{font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif;font-size:15px;font-weight:700;fill:#0f172a}
      .field{font-family:Menlo,Monaco,"PingFang SC","Microsoft YaHei",monospace;font-size:12px;font-weight:400;fill:#334155}
      .label{font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif;font-size:11px;font-weight:600;fill:#475569}
      .calc{font-family:"PingFang SC","Microsoft YaHei",Arial,sans-serif;font-size:12px;font-weight:600;fill:#6d28d9}
      .line{fill:none;stroke:#64748b;stroke-width:1.6;marker-end:url(#arrow)}
      .dash{fill:none;stroke:#7c3aed;stroke-width:1.7;stroke-dasharray:6 5;marker-end:url(#arrowPurple)}
    </style>
  </defs>
  <rect width="1280" height="720" fill="#f8fafc"/>
  <text class="title" x="42" y="42">HRM 考勤管理表关系</text>
  <text class="subtitle" x="42" y="67">实线为业务关联；紫色虚线表示查询时实时读取，不生成考勤月结果表</text>

  <!-- 外部基础数据 -->
  <g filter="url(#shadow)">
    <rect x="40" y="105" width="230" height="104" rx="12" fill="#ffffff" stroke="#93c5fd"/>
    <rect x="40" y="105" width="230" height="34" rx="12" fill="#dbeafe"/>
    <rect x="40" y="127" width="230" height="12" fill="#dbeafe"/>
    <text class="box-title" x="56" y="128">system_dept</text>
    <text class="field" x="56" y="162">PK id</text>
    <text class="field" x="56" y="184">name / parent_id</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="40" y="268" width="230" height="126" rx="12" fill="#ffffff" stroke="#93c5fd"/>
    <rect x="40" y="268" width="230" height="34" rx="12" fill="#dbeafe"/>
    <rect x="40" y="290" width="230" height="12" fill="#dbeafe"/>
    <text class="box-title" x="56" y="291">hrm_employee</text>
    <text class="field" x="56" y="325">PK id</text>
    <text class="field" x="56" y="347">dept_id → system_dept</text>
    <text class="field" x="56" y="369">user_id → system_users</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="40" y="475" width="230" height="104" rx="12" fill="#ffffff" stroke="#c4b5fd"/>
    <rect x="40" y="475" width="230" height="34" rx="12" fill="#ede9fe"/>
    <rect x="40" y="497" width="230" height="12" fill="#ede9fe"/>
    <text class="box-title" x="56" y="498">BPM 流程实例</text>
    <text class="field" x="56" y="532">id</text>
    <text class="field" x="56" y="554">definition_key / status</text>
  </g>

  <!-- 考勤配置 -->
  <g filter="url(#shadow)">
    <rect x="355" y="92" width="340" height="263" rx="12" fill="#ffffff" stroke="#5eead4"/>
    <rect x="355" y="92" width="340" height="36" rx="12" fill="#ccfbf1"/>
    <rect x="355" y="116" width="340" height="12" fill="#ccfbf1"/>
    <text class="box-title" x="371" y="116">hrm_attendance_group</text>
    <text class="field" x="371" y="151">PK id / name / default_status</text>
    <text class="field" x="371" y="175">dept_ids → system_dept.id [列表]</text>
    <text class="field" x="371" y="199">employee_ids → hrm_employee.id [列表]</text>
    <text class="field" x="371" y="223">shifts [JSON] / special_dates [JSON]</text>
    <text class="field" x="371" y="247">points [JSON] / wifis [JSON]</text>
    <text class="field" x="371" y="271">deduct_rule [JSON]</text>
    <text class="field" x="371" y="295">open_point_card / open_wifi_card</text>
    <text class="field" x="371" y="319">rest（法定节假日是否休息）</text>
    <text class="label" x="371" y="341">单聚合：班次、地点、WiFi、扣款不拆表</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="355" y="420" width="340" height="126" rx="12" fill="#ffffff" stroke="#5eead4"/>
    <rect x="355" y="420" width="340" height="36" rx="12" fill="#ccfbf1"/>
    <rect x="355" y="444" width="340" height="12" fill="#ccfbf1"/>
    <text class="box-title" x="371" y="444">hrm_attendance_holiday</text>
    <text class="field" x="371" y="480">PK id</text>
    <text class="field" x="371" y="504">date</text>
    <text class="field" x="371" y="528">type：1 上班 / 2 休息</text>
  </g>

  <!-- 业务事实 -->
  <g filter="url(#shadow)">
    <rect x="780" y="92" width="290" height="215" rx="12" fill="#ffffff" stroke="#fdba74"/>
    <rect x="780" y="92" width="290" height="36" rx="12" fill="#ffedd5"/>
    <rect x="780" y="116" width="290" height="12" fill="#ffedd5"/>
    <text class="box-title" x="796" y="116">hrm_attendance_clock</text>
    <text class="field" x="796" y="151">PK id</text>
    <text class="field" x="796" y="175">employee_id → hrm_employee.id</text>
    <text class="field" x="796" y="199">clock_time / attendance_time</text>
    <text class="field" x="796" y="223">type / source_type / status / stage</text>
    <text class="field" x="796" y="247">address / longitude / latitude</text>
    <text class="field" x="796" y="271">ssid / mac / remark</text>
    <text class="label" x="796" y="293">管理端仅能维护手工录入记录</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="780" y="365" width="290" height="215" rx="12" fill="#ffffff" stroke="#fdba74"/>
    <rect x="780" y="365" width="290" height="36" rx="12" fill="#ffedd5"/>
    <rect x="780" y="389" width="290" height="12" fill="#ffedd5"/>
    <text class="box-title" x="796" y="389">hrm_attendance_leave</text>
    <text class="field" x="796" y="424">PK id = BPM businessKey</text>
    <text class="field" x="796" y="448">employee_id → hrm_employee.id</text>
    <text class="field" x="796" y="472">type / start_time / end_time / day</text>
    <text class="field" x="796" y="496">approval_status（BPM 状态）</text>
    <text class="field" x="796" y="520">process_instance_id [UK]</text>
    <text class="field" x="796" y="544">approval_time / approval_reason</text>
    <text class="label" x="796" y="566">仅审批通过记录参与考勤计算</text>
  </g>

  <!-- 计算节点 -->
  <g filter="url(#shadow)">
    <rect x="1110" y="210" width="140" height="228" rx="16" fill="#faf5ff" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="7 5"/>
    <text class="box-title" x="1128" y="244">实时统计</text>
    <text class="calc" x="1128" y="278">每日结果</text>
    <text class="calc" x="1128" y="306">月度概况</text>
    <text class="calc" x="1128" y="334">月度汇总</text>
    <text class="calc" x="1128" y="362">请假天数</text>
    <text class="calc" x="1128" y="390">异常与扣款</text>
    <text class="label" x="1128" y="419">不落统计表</text>
  </g>

  <!-- 关系线 -->
  <path class="line" d="M270 157 H322 Q336 157 336 171 V175 H355"/>
  <text class="label" x="278" y="146">N:M 逻辑列表</text>
  <path class="line" d="M270 331 H318 Q336 331 336 244 H355"/>
  <text class="label" x="278" y="319">N:M 逻辑列表</text>
  <path class="line" d="M270 310 H312 V78 H1088 V192 H1070"/>
  <text class="label" x="710" y="70">1:N 打卡</text>
  <path class="line" d="M270 365 H720 Q744 365 744 447 H780"/>
  <text class="label" x="594" y="384">1:N 请假</text>
  <path class="line" d="M270 527 H300 V610 H740 V520 H780"/>
  <text class="label" x="590" y="602">1:1 流程实例</text>

  <path class="dash" d="M695 145 H730 V330 H1110"/>
  <path class="dash" d="M695 484 H720 V630 H1090 V410 H1110"/>
  <path class="dash" d="M1070 198 H1094 Q1104 198 1110 268"/>
  <path class="dash" d="M1070 473 H1092 Q1102 473 1110 391"/>
  <text class="label" x="960" y="674">统计同时读取：员工 + 考勤组 + 节假日 + 打卡 + 审批通过请假</text>
  <path class="dash" d="M270 382 H300 V650 H1180 V438"/>
</svg>
