<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc"><title id="title">OA 企业云盘表关系</title><desc id="desc">文件节点、共享权限、文件收藏的表结构与关联关系</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker><marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/></marker><style>.t{font:700 30px sans-serif;fill:#0f172a}.st{font:15px sans-serif;fill:#475569}.gl{font:700 20px sans-serif}.n{font:700 18px monospace;fill:#0f172a}.n2{font:700 15px monospace;fill:#0f172a}.d{font:14px sans-serif;fill:#475569}.k{font:13px monospace;fill:#64748b}.b{stroke-width:1.5;rx:12}.grp{fill:none;stroke-dasharray:6 5;stroke-width:1.5;rx:14}.p{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#a)}.pd{fill:none;stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:5 4;marker-end:url(#b)}.nd{fill:#eff6ff;stroke:#60a5fa}.pm{fill:#fff7ed;stroke:#fb923c}.fv{fill:#f0fdf4;stroke:#4ade80}.sy{fill:#f1f5f9;stroke:#94a3b8}</style></defs><rect width="1600" height="980" fill="#f8fafc"/><text x="60" y="58" class="t">OA 企业云盘表关系</text><text x="60" y="92" class="st">文件夹与文件共用 oa_file_node；共享按用户/部门授权，收藏只做个人入口；回收站与彻底删除分开表达</text><rect x="60" y="130" width="700" height="480" class="grp" stroke="#93c5fd"/><text x="84" y="163" class="gl" fill="#2563eb">① 文件管理</text><rect x="120" y="220" width="340" height="300" class="b nd"/><text x="142" y="257" class="n">oa_file_node</text><text x="142" y="291" class="d">parent_id（根 = 0）</text><text x="142" y="317" class="d">type / name / extension</text><text x="142" y="343" class="d">category / size / url</text><text x="142" y="369" class="d">dept_id / status</text><text x="142" y="403" class="k">type：0 文件夹 / 1 文件</text><text x="142" y="427" class="k">status：0 正常 / 1 回收站</text><text x="142" y="451" class="k">deleted = 彻底删除</text><text x="142" y="475" class="k">category 由扩展名计算</text><path d="M290 220 C250 190 200 190 200 220" class="pd"/><text x="310" y="200" class="k">parent_id 自关联 1 : N</text><text x="500" y="280" class="k">create → NORMAL</text><text x="500" y="308" class="k">recycle → RECYCLED</text><text x="500" y="336" class="k">（只改当前节点）</text><text x="500" y="364" class="k">restore → NORMAL</text><text x="500" y="392" class="k">（父必须可用）</text><text x="500" y="420" class="k">delete 须先在回收站</text><text x="500" y="448" class="k">级联权限与收藏</text><text x="500" y="476" class="k">不删 Infra 物理文件</text><text x="500" y="520" class="k">scope：my / shared /</text><text x="500" y="544" class="k">favorite / recycle</text><text x="100" y="580" class="k">容量含回收站；列表不暴露 url，详情 DOWNLOAD 才签临时地址</text><rect x="800" y="130" width="370" height="300" class="grp" stroke="#fdba74"/><text x="824" y="163" class="gl" fill="#ea580c">② 共享权限</text><rect x="830" y="185" width="310" height="220" class="b pm"/><text x="852" y="222" class="n2">oa_file_permission</text><text x="852" y="256" class="d">node_id</text><text x="852" y="282" class="d">subject_type / subject_id</text><text x="852" y="308" class="d">level / inherit / expire_time</text><text x="852" y="342" class="k">1 只读 ~ 4 管理</text><text x="852" y="366" class="k">本人节点直接 MANAGE</text><rect x="1200" y="130" width="340" height="300" class="grp" stroke="#86efac"/><text x="1224" y="163" class="gl" fill="#16a34a">③ 文件收藏</text><rect x="1230" y="185" width="290" height="220" class="b fv"/><text x="1252" y="222" class="n2">oa_file_favorite</text><text x="1252" y="256" class="d">node_id / user_id</text><text x="1252" y="282" class="d">只做个人入口</text><text x="1252" y="316" class="k">不复制文件</text><text x="1252" y="340" class="k">不增加访问权限</text><path d="M760 300 H830" class="p"/><text x="770" y="286" class="k">1 : N</text><text x="770" y="322" class="k">node_id</text><path d="M460 420 C700 480 1000 360 1230 300" class="p"/><text x="980" y="400" class="k">1 : N  node_id</text><rect x="800" y="460" width="740" height="150" class="grp" stroke="#fdba74"/><text x="824" y="493" class="gl" fill="#ea580c">权限级别与主体</text><text x="830" y="530" class="k">level：1 READ / 2 DOWNLOAD / 3 EDIT / 4 MANAGE</text><text x="830" y="556" class="k">subject_type：1 用户 / 2 部门；inherit 控制是否向子目录传递</text><text x="830" y="582" class="k">字典：oa_file_category / oa_file_permission_level / oa_file_subject_type</text><rect x="60" y="700" width="1480" height="200" class="grp" stroke="#cbd5e1"/><text x="84" y="733" class="gl" fill="#475569">跨模块关联（System）</text><rect x="90" y="755" width="320" height="120" class="b sy"/><text x="112" y="792" class="n2">system_users</text><text x="112" y="826" class="d">node.creator / favorite.user_id</text><text x="112" y="852" class="d">permission.subject_id（用户）</text><rect x="440" y="755" width="320" height="120" class="b sy"/><text x="462" y="792" class="n2">system_dept</text><text x="462" y="826" class="d">oa_file_node.dept_id 创建快照</text><text x="462" y="852" class="d">permission.subject_id（部门）</text><text x="800" y="792" class="k">文件 url 由 Infra 文件服务上传结果写入；彻底删除不删物理文件</text><text x="800" y="822" class="k">预览/下载临时地址由 fileApi.presignGetUrl 签发，受 DOWNLOAD 权限控制</text><text x="800" y="852" class="k">本文企业云盘不涉及 BPM 流程</text><text x="60" y="950" class="st">箭头表示业务字段关联，不代表数据库外键约束；虚线箭头表示节点自关联（目录树）。</text></svg>
