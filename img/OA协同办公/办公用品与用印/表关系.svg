<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
<title id="title">OA 办公用品与用印表关系</title>
<desc id="desc">办公用品信息、领用申请与发放、印章信息、用印申请四个功能的表结构与关联关系</desc>
<defs>
  <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
  <marker id="b" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/></marker>
  <style>
    .t{font:700 30px sans-serif;fill:#0f172a}
    .st{font:15px sans-serif;fill:#475569}
    .gl{font:700 20px sans-serif}
    .n{font:700 18px monospace;fill:#0f172a}
    .n2{font:700 15px monospace;fill:#0f172a}
    .d{font:14px sans-serif;fill:#475569}
    .k{font:13px monospace;fill:#64748b}
    .b{stroke-width:1.5;rx:12}
    .grp{fill:none;stroke-dasharray:6 5;stroke-width:1.5;rx:14}
    .p{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#a)}
    .pd{fill:none;stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:5 4;marker-end:url(#b)}
    .si{fill:#eff6ff;stroke:#60a5fa}
    .sa{fill:#fff7ed;stroke:#fb923c}
    .sl{fill:#f0fdf4;stroke:#4ade80}
    .sy{fill:#faf5ff;stroke:#c084fc}
    .sys{fill:#f1f5f9;stroke:#94a3b8}
  </style>
</defs>
<rect width="1600" height="1120" fill="#f8fafc"/>
<text x="60" y="58" class="t">OA 办公用品与用印表关系</text>
<text x="60" y="92" class="st">用品库存与申请状态分别维护：审批通过不扣库存；发放扣库存，借用品归还加库存。用印审批与印章台账状态相互独立</text>

<!-- ① 办公用品 -->
<rect x="60" y="130" width="340" height="300" class="grp" stroke="#93c5fd"/>
<text x="84" y="163" class="gl" fill="#2563eb">① 办公用品信息</text>
<rect x="90" y="185" width="280" height="220" class="b si"/>
<text x="112" y="222" class="n">oa_supply_item</text>
<text x="112" y="256" class="d">category / manage_type</text>
<text x="112" y="282" class="d">stock_quantity</text>
<text x="112" y="308" class="d">status = CommonStatusEnum</text>
<text x="112" y="342" class="k">dept_id → system_dept</text>
<text x="112" y="368" class="k">入库加库存，发放扣库存</text>

<!-- ② 领用申请 -->
<rect x="430" y="130" width="720" height="400" class="grp" stroke="#fdba74"/>
<text x="454" y="163" class="gl" fill="#ea580c">② 领用申请与发放</text>
<rect x="460" y="245" width="280" height="230" class="b sa"/>
<text x="482" y="282" class="n2">oa_supply_apply</text>
<text x="482" y="316" class="d">no 前缀 YP</text>
<text x="482" y="342" class="d">use_type / pickup_method</text>
<text x="482" y="368" class="d">status = BPM</text>
<text x="482" y="394" class="d">process_instance_id</text>
<text x="482" y="428" class="k">流程 key: oa_supply_apply</text>
<text x="482" y="454" class="k">creator = 申请人</text>
<rect x="840" y="185" width="290" height="300" class="b sa"/>
<text x="862" y="222" class="n2">oa_supply_apply_item</text>
<text x="862" y="256" class="d">apply_id / item_id</text>
<text x="862" y="282" class="d">快照：name/model/unit</text>
<text x="862" y="308" class="d">apply / issued / returned</text>
<text x="862" y="334" class="d">status 本地：-1~3</text>
<text x="862" y="368" class="k">审批通过 → 待发放(0)</text>
<text x="862" y="394" class="k">发放扣库存；借用品→待归还</text>
<text x="862" y="420" class="k">归还加库存；还完→已归还</text>
<text x="862" y="454" class="k">无独立发放表，复用明细</text>
<path d="M740 340 H840" class="p"/>
<text x="762" y="328" class="k">1 : N</text>
<text x="750" y="360" class="k">apply_id</text>
<path d="M370 280 C400 260 420 240 460 240" class="p"/>
<text x="390" y="248" class="k">item_id</text>
<text x="390" y="268" class="k">N : 1</text>
<text x="460" y="510" class="k">提交与审批通过均不扣库存；仅 issueSupply / returnSupply 变更库存</text>

<!-- ③ 印章 -->
<rect x="60" y="560" width="340" height="260" class="grp" stroke="#86efac"/>
<text x="84" y="593" class="gl" fill="#16a34a">③ 印章信息</text>
<rect x="90" y="615" width="280" height="180" class="b sl"/>
<text x="112" y="652" class="n">oa_seal</text>
<text x="112" y="686" class="d">no 前缀 YZ UNIQUE</text>
<text x="112" y="712" class="d">status：在库/停用/使用中</text>
<text x="112" y="746" class="k">不随用印申请自动改状态</text>
<text x="112" y="772" class="k">keeper_user_id / dept_id</text>

<!-- ④ 用印申请 -->
<rect x="430" y="560" width="720" height="260" class="grp" stroke="#d8b4fe"/>
<text x="454" y="593" class="gl" fill="#9333ea">④ 用印申请</text>
<rect x="460" y="615" width="660" height="180" class="b sy"/>
<text x="482" y="652" class="n2">oa_seal_apply</text>
<text x="482" y="686" class="d">no 前缀 YY · seal_id + 印章快照</text>
<text x="482" y="712" class="d">status = BPM · use_status 本地（0~4）</text>
<text x="482" y="738" class="d">mode=外借时提交校验时段冲突</text>
<text x="482" y="772" class="k">流程 key: oa_seal_apply · 登记接口未实现，use_status 设计保留</text>
<path d="M370 700 H460" class="p"/>
<text x="390" y="688" class="k">1 : N</text>
<text x="390" y="720" class="k">seal_id</text>

<!-- 跨模块 -->
<rect x="60" y="850" width="1480" height="215" class="grp" stroke="#cbd5e1"/>
<text x="84" y="883" class="gl" fill="#475569">跨模块关联（System / BPM）</text>
<rect x="90" y="905" width="300" height="120" class="b sys"/>
<text x="112" y="942" class="n2">system_users</text>
<text x="112" y="976" class="d">creator / user_id</text>
<text x="112" y="1002" class="d">keeper / issue_user_id</text>
<rect x="420" y="905" width="300" height="120" class="b sys"/>
<text x="442" y="942" class="n2">system_dept</text>
<text x="442" y="976" class="d">dept_id / keeper_dept_id</text>
<text x="442" y="1002" class="d">创建时冗余部门归属</text>
<rect x="750" y="905" width="300" height="120" class="b sys"/>
<text x="772" y="942" class="n2">BPM 流程实例</text>
<text x="772" y="976" class="d">oa_supply_apply</text>
<text x="772" y="1002" class="d">oa_seal_apply</text>
<text x="1080" y="942" class="k">用品：审批通过后才待发放；发放才扣库存</text>
<text x="1080" y="972" class="k">用印：审批通过≠实际借出；台账 status 手工维护</text>
<text x="1080" y="1002" class="k">字典展示 BPM 用 bpm_process_instance_status</text>
<text x="60" y="1095" class="st">箭头表示业务字段关联，不代表数据库外键约束；虚线箭头表示跨模块或汇总关系。</text>
</svg>
