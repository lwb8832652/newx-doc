<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">FMS 财务管理模块关系</title>
  <desc id="desc">账套设置、凭证、账簿、报表与期末结账的业务链路</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker><style>.t{font:700 30px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}.s{font:700 18px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#334155}.n{font:700 18px ui-monospace,Menlo,monospace;fill:#0f172a}.d{font:14px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#475569}.b{stroke:#94a3b8;stroke-width:1.5;rx:12}.c{fill:#eff6ff;stroke:#60a5fa}.v{fill:#fff7ed;stroke:#fb923c}.l{fill:#f0fdf4;stroke:#4ade80}.r{fill:#faf5ff;stroke:#c084fc}.p{fill:none;stroke:#64748b;stroke-width:2.2;marker-end:url(#a)}</style></defs>
  <rect width="1600" height="900" fill="#f8fafc"/><text x="60" y="58" class="t">FMS 财务管理模块关系</text><text x="60" y="90" class="d">以当前账套为边界，设置、凭证、账簿、报表和结账形成完整财务链路</text>
  <text x="70" y="160" class="s">账套与基础设置</text><rect x="70" y="180" width="300" height="150" class="b c"/><text x="90" y="220" class="n">fms_account_set</text><text x="90" y="250" class="d">账套 / 本位币 / 启用期间</text><text x="90" y="278" class="d">财务参数 / 指标 / 成员</text>
  <rect x="430" y="180" width="300" height="150" class="b c"/><text x="450" y="220" class="n">fms_subject</text><text x="450" y="250" class="d">科目树 / 辅助核算 / 数量</text><text x="450" y="278" class="d">初始余额与币别</text>
  <text x="70" y="410" class="s">日常记账</text><rect x="70" y="430" width="300" height="150" class="b v"/><text x="90" y="470" class="n">fms_voucher</text><text x="90" y="500" class="d">凭证主表</text><text x="90" y="528" class="d">fms_voucher_entry 分录</text>
  <text x="430" y="410" class="s">账簿与报表</text><rect x="430" y="430" width="300" height="150" class="b l"/><text x="450" y="470" class="n">FmsLedgerService</text><text x="450" y="500" class="d">八类账簿实时取数</text><text x="450" y="528" class="d">无独立 fms_ledger 表</text><rect x="790" y="430" width="300" height="150" class="b l"/><text x="810" y="470" class="n">fms_*_report</text><text x="810" y="500" class="d">三大报表配置与期间快照</text><text x="810" y="528" class="d">按公式实时计算金额</text>
  <text x="1150" y="410" class="s">期末处理</text><rect x="1150" y="430" width="330" height="150" class="b r"/><text x="1170" y="470" class="n">fms_closing</text><text x="1170" y="500" class="d">结转方案 / 模板 / 结账期间</text><text x="1170" y="528" class="d">生成结转凭证后登记结账</text>
  <path d="M370 255 H430" class="p"/><path d="M220 330 V430" class="p"/><path d="M580 330 V430" class="p"/><path d="M370 505 H430" class="p"/><path d="M730 505 H790" class="p"/><path d="M1090 505 H1150" class="p"/><text x="380" y="245" class="d">account_set_id</text><text x="240" y="390" class="d">初始化科目</text><text x="600" y="390" class="d">期初余额</text><text x="740" y="495" class="d">发生额</text><text x="1095" y="495" class="d">检查 / 结转</text>
</svg>
